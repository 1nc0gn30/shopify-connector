<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="emeraldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#008060" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#10B981" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#08080B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
  </defs>

  <!-- Dark Obsidian Base -->
  <rect width="100" height="100" rx="20" fill="#08080B" stroke="#1F2332" stroke-width="2"/>
  
  <!-- Subtle Aura Glow -->
  <circle cx="50" cy="50" r="38" fill="url(#emeraldGlow)"/>

  <!-- Hexagonal Tech Silhouette -->
  <polygon points="50,15 82,32 82,68 50,85 18,68 18,32" fill="none" stroke="url(#goldGradient)" stroke-width="2.5" stroke-linejoin="round"/>
  
  <!-- Inner Shopping Bag Contour -->
  <path d="M 34 42 L 38 72 L 62 72 L 66 42 Z" fill="#0F131D" stroke="#10B981" stroke-width="2"/>
  
  <!-- Bag Handle -->
  <path d="M 44 42 C 44 34, 56 34, 56 42" fill="none" stroke="#D4AF37" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Central GraphQL Node / Sparkle -->
  <circle cx="50" cy="57" r="4" fill="#008060" stroke="#FFFFFF" stroke-width="1.5"/>
  <line x1="50" y1="49" x2="50" y2="53" stroke="#D4AF37" stroke-width="1.5"/>
  <line x1="50" y1="61" x2="50" y2="65" stroke="#D4AF37" stroke-width="1.5"/>
  <line x1="42" y1="57" x2="46" y2="57" stroke="#D4AF37" stroke-width="1.5"/>
  <line x1="54" y1="57" x2="58" y2="57" stroke="#D4AF37" stroke-width="1.5"/>
</svg>
